<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311b92" />
    </linearGradient>
    <linearGradient id="atomGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Nuclear Orbital Rings -->
  <g filter="url(#glowEffect)" opacity="0.85">
    <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#38bdf8" stroke-width="6" transform="rotate(-30 256 256)" />
    <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#a855f7" stroke-width="6" transform="rotate(30 256 256)" />
    <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#ec4899" stroke-width="6" transform="rotate(90 256 256)" />
  </g>

  <!-- Colliding Spherical Nuclei (Target and Projectile) -->
  <g filter="url(#glowEffect)">
    <!-- Projectile Nucleus (Small) -->
    <circle cx="180" cy="256" r="42" fill="url(#atomGlow)" />
    <!-- Target Nucleus (Large) -->
    <circle cx="320" cy="256" r="68" fill="url(#atomGlow)" opacity="0.9" />
  </g>

  <!-- Double Folding Potential Curve V(R) Overlay -->
  <path d="M 80,360 Q 180,380 230,160 T 320,380 L 430,390" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />

  <!-- App Label Text -->
  <text x="256" y="460" font-family="system-ui, sans-serif" font-weight="800" font-size="38" fill="#f8fafc" text-anchor="middle" letter-spacing="2">DFMSPH22</text>
</svg>
